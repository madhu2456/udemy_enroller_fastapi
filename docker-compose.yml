services:
  web:
    build: .
    container_name: udemy-enroller
    ports:
      # Loopback bind: only host nginx can reach the app, so the app's TCP peer
      # is always the Docker bridge gateway. This makes the gateway trustworthy
      # for TRUSTED_PROXY_IPS (resolved in docker-entrypoint.sh). Do NOT publish
      # on 0.0.0.0 unless proxy trust is re-evaluated first — an untrusted peer
      # that can set X-Forwarded-For would spoof per-IP rate-limit buckets.
      - "127.0.0.1:8000:8000"
    environment:
      - APP_NAME=Udemy Course Enroller
      - DEBUG=false
      - SECRET_KEY=${SECRET_KEY}
      - COOKIE_ENCRYPTION_KEY=${COOKIE_ENCRYPTION_KEY}
      - DEPLOYMENT_ENV=server
      - DATABASE_URL=sqlite:////app/data/udemy_enroller.db
      # Persist public coupon catalog on the data volume (survives image rebuilds)
      - PUBLIC_DEALS_PATH=/app/data/public_deals.json
      - LOG_LEVEL=WARNING
      - GOOGLE_SITE_VERIFICATION=${GOOGLE_SITE_VERIFICATION:-}
      - BING_SITE_VERIFICATION=${BING_SITE_VERIFICATION:-}
      - GTM_CONTAINER_ID=${GTM_CONTAINER_ID:-}
      - GA4_MEASUREMENT_ID=${GA4_MEASUREMENT_ID:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-[]}
      # Anchors the login-CSRF origin gate to the public netloc behind the
      # Cloudflare/nginx proxy (PUBLIC_BASE_URL in the host .env, e.g.
      # https://udemyenroller.madhudadi.in). Empty = fall back to request.base_url.
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
      # Host-header pinning (F049): comma-separated allowlist forwarded to
      # TrustedHostMiddleware (comma-separated, NOT JSON — see
      # config/settings.py allowed_hosts_list). Unset/empty = the secure
      # pinned default baked into the image (loopback + testserver +
      # udemyenroller.madhudadi.in + www variant). Override on the host .env
      # only to pin additional real hosts. "*" disables the middleware
      # entirely — NEVER in a server deployment (docker-entrypoint.sh warns).
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-}
    volumes:
      - app-data:/app/data
      - app-logs:/app/logs
      - app-courses:/app/Courses
    # F010 (UE-portion): runtime hardening. cap_drop ALL removes every Linux
    # capability; no-new-privileges blocks escalation through setuid/setgid
    # binaries (su, mount, newuidmap); read_only makes the rootfs immutable.
    # Writable paths remain the named volumes (uid 1001 via image chown —
    # Docker copies image ownership into fresh volumes) plus tmpfs scratch.
    # NET_BIND_SERVICE is defensive only: both listeners (8000 here, 8001 on
    # coupon-checker) are unprivileged ports that do not require it.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
      - /var/tmp
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Re-validates public_deals.json coupons (not user DB) every 2 hours.
  # Shares the data volume with web so /udemycoupons stays current without
  # local runs + git push.
  coupon-checker:
    build: .
    container_name: udemy-enroller-coupon-checker
    # Same uid as web appuser so public_deals.json stays writable by both services
    user: "1001:1001"
    entrypoint: ["python", "-u", "scripts/coupon_checker_loop.py"]
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - COOKIE_ENCRYPTION_KEY=${COOKIE_ENCRYPTION_KEY}
      - DEPLOYMENT_ENV=server
      - PUBLIC_DEALS_PATH=/app/data/public_deals.json
      - COUPON_CHECKER_INTERVAL_SECONDS=${COUPON_CHECKER_INTERVAL_SECONDS:-7200}
      - COUPON_CHECKER_RUN_ON_START=${COUPON_CHECKER_RUN_ON_START:-true}
      - CHECKER_SCRAPE_ON_CYCLE=${CHECKER_SCRAPE_ON_CYCLE:-true}
      - CHECKER_SCRAPE_MAX_SOURCES=${CHECKER_SCRAPE_MAX_SOURCES:-0}
      - LOG_LEVEL=${COUPON_CHECKER_LOG_LEVEL:-INFO}
      - PROXIES=${PROXIES:-}
      - COUPON_CHECKER_HEALTH_PORT=${COUPON_CHECKER_HEALTH_PORT:-8001}
    volumes:
      - app-data:/app/data
      - app-logs:/app/logs
    # F010 (UE-portion): same hardening as the web service (cap_drop ALL +
    # no-new-privileges + read_only + tmpfs). Public-deal rewrites target the
    # app-data volume; the liveness server binds an unprivileged port.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
      - /var/tmp
    depends_on:
      web:
        condition: service_healthy
    # Loop process is not an HTTP server — the /health endpoint (F-ENRL-C15)
    # on 127.0.0.1:8001 reports liveness + catalog freshness (503 when no
    # successful cycle within 26h). Port override: COUPON_CHECKER_HEALTH_PORT
    # (env var, passthrough above; if changed, update the healthcheck URL).
    # NOTE: .env.example cannot document this var — repo tool policy blocks
    # edits to *.env.* files; this compose block is the reference instead.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  app-data:
  app-logs:
  app-courses:
