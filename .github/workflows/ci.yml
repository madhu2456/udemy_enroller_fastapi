name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Backend & E2E Validation
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        # Pin full commit SHA (tag v4.2.2) for supply-chain integrity
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Secret scan
        run: bash scripts/verify-no-secrets.sh --tree

      - name: Udemy host-validation gate (F-ENRL-C07)
        run: bash scripts/verify-no-udemy-substring.sh --tree

      - name: Setup Python
        # Pin full commit SHA (tag v5.6.0)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install ruff
          python -m pip install pip-audit
          playwright install chromium

      - name: Lint with ruff
        run: ruff check .

      # ── Dependency vulnerability audit (F-ENRL-C06) ────────────────────
      # Fails on known vulnerabilities in requirements.lock. Exceptions are
      # documented allowlist flags inside scripts/audit-deps.sh (--ignore-vuln
      # with a justification) — never add one silently.
      - name: Audit Python dependencies (pip-audit)
        run: bash scripts/audit-deps.sh

      # ── Type checking (F-ENRL-P01) — report-only for now ───────────────
      # Non-blocking baseline job: mypy app/ will fail here once the legacy
      # findings in security.py / enrollment_manager.py are resolved.
      - name: Type check with mypy (report-only)
        run: |
          python -m pip install mypy
          python -m mypy app/
        continue-on-error: true

      - name: Prepare isolated CI database
        run: |
          rm -f test_udemy_enroller.db
          CI_DB="$RUNNER_TEMP/ci_udemy_enroller.db"
          touch "$CI_DB"
          echo "CI_DB=$CI_DB" >> "$GITHUB_ENV"
          echo "DATABASE_URL=sqlite:///${CI_DB}" >> "$GITHUB_ENV"

      - name: Run migrations
        run: python scripts/alembic_upgrade_pinned.py "$CI_DB" head

      - name: Run unit tests
        run: python -m pytest

      # Per-module coverage annotations (F-ENRL-P01): the documented target is
      # >=60% for app/security.py and app/services/enrollment_manager.py.
      - name: Coverage annotations (security.py / enrollment_manager >=60%)
        run: |
          python -m coverage report -m app/security.py app/services/enrollment_manager.py

      # ── Accessibility and browser tests ──────────────────────────────
      - name: Setup Node.js
        # Pin full commit SHA (tag v4.4.0)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      - name: Start local server
        run: |
          python run.py &
          sleep 5
          curl -sf http://127.0.0.1:8000/api/health || (echo "Server failed to start" && exit 1)

      - name: Run accessibility audit (axe-core)
        run: BASE_URL=http://127.0.0.1:8000 npm run audit:wcag
        continue-on-error: true

      - name: Run browser smoke tests
        run: BASE_URL=http://127.0.0.1:8000 BROWSERS=chromium npm run smoke:browsers
        continue-on-error: true

  deploy:
    name: Deploy to Server
    needs: test
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: udemy-enroller-production
      cancel-in-progress: false

    steps:
      - name: Get latest code
        # Pin full commit SHA (tag v4.2.2) for supply-chain integrity
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The rsync action copies your project files to the remote server.
      # Excludes are used so we don't overwrite virtual environments or local DBs.
      - name: Sync files to remote server
        # Pin full commit SHA (tag 7.0.1)
        uses: burnett01/rsync-deployments@4d419d1dc46d4a8a2b6ceab2f951f0f93b2da8f5 # 9
        with:
          switches: -avzr --delete --exclude=.git/ --exclude=venv/ --exclude=__pycache__/ --exclude=*.db --exclude=.env
          rsh: -4 -o BatchMode=yes -o ConnectTimeout=30
          path: ./
          remote_path: /opt/udemy-enroller
          remote_host: ${{ secrets.SERVER_HOST }}
          remote_user: ${{ secrets.SERVER_USER }}
          remote_key: ${{ secrets.SSH_KEY_DEPLOY }}

      # Restart Docker on the remote host after sync.
      - name: Restart Docker Container
        # Pin full commit SHA (release tag v1.2.5); never use @master
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          protocol: tcp4
          key: ${{ secrets.SSH_KEY_DEPLOY }}
          script: |
            cd /opt/udemy-enroller
            docker compose up -d --build
            echo "Waiting for Udemy Enroller health on :8000..."
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8000/api/health >/dev/null 2>&1; then
                echo "✅ Udemy Enroller healthy."
                exit 0
              fi
              sleep 2
            done
            echo "❌ Health check timed out:"
            docker compose logs --tail=100 || true
            exit 1
