name: Build Standalone Executables (Gui.exe & cli.exe)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-executables-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: windows-binaries
            gui_name: Gui.exe
            cli_name: cli.exe
            release_gui_name: Gui.exe
            release_cli_name: cli.exe
          - os: ubuntu-latest
            artifact_name: linux-binaries
            gui_name: Gui
            cli_name: cli
            release_gui_name: Gui-linux
            release_cli_name: cli-linux
          - os: macos-latest
            artifact_name: macos-binaries
            gui_name: Gui
            cli_name: cli
            release_gui_name: Gui-macos
            release_cli_name: cli-macos

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Executables
        env:
          PYTHONIOENCODING: "utf-8"
        run: |
          python build_exe.py --all

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/${{ matrix.gui_name }}
            dist/${{ matrix.cli_name }}
          if-no-files-found: error

      - name: Prepare Release Asset Names
        if: startsWith(github.ref, 'refs/tags/') && runner.os != 'Windows'
        run: |
          mv dist/${{ matrix.gui_name }} dist/${{ matrix.release_gui_name }}
          mv dist/${{ matrix.cli_name }} dist/${{ matrix.release_cli_name }}

      - name: Attach Binaries to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/${{ matrix.release_gui_name }}
            dist/${{ matrix.release_cli_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
