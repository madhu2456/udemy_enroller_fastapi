name: Build Standalone Executables (Gui.exe & cli.exe)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: build-executables-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: windows-binaries
            gui_name: Gui.exe
            cli_name: cli.exe
          - os: ubuntu-latest
            artifact_name: linux-binaries
            gui_name: Gui
            cli_name: cli
          - os: macos-latest
            artifact_name: macos-binaries
            gui_name: Gui
            cli_name: cli

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Executables
        run: |
          python build_exe.py --all

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/${{ matrix.gui_name }}
            dist/${{ matrix.cli_name }}
          if-no-files-found: error
