name: Build Standalone Executables (Gui.exe & cli.exe)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-executables-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: windows-binaries
            gui_name: Gui.exe
            cli_name: cli.exe
            release_gui_name: Gui.exe
            release_cli_name: cli.exe
          - os: ubuntu-latest
            artifact_name: linux-binaries
            gui_name: Gui
            cli_name: cli
            release_gui_name: Gui-linux
            release_cli_name: cli-linux
          - os: macos-latest
            artifact_name: macos-binaries
            gui_name: Gui
            cli_name: cli
            release_gui_name: Gui-macos
            release_cli_name: cli-macos

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Executables
        env:
          PYTHONIOENCODING: "utf-8"
        run: |
          python build_exe.py --all

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/${{ matrix.gui_name }}
            dist/${{ matrix.cli_name }}
          if-no-files-found: error

      - name: Prepare Release Asset Names
        if: startsWith(github.ref, 'refs/tags/') && runner.os != 'Windows'
        run: |
          mv dist/${{ matrix.gui_name }} dist/${{ matrix.release_gui_name }}
          mv dist/${{ matrix.cli_name }} dist/${{ matrix.release_cli_name }}

      - name: Attach Binaries to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.0.8
        with:
          files: |
            dist/${{ matrix.release_gui_name }}
            dist/${{ matrix.release_cli_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
