name: Build Standalone Executables (Gui.exe & cli.exe)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: build-executables-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: windows-binaries
            gui_name: Gui.exe
            cli_name: cli.exe
          - os: ubuntu-latest
            artifact_name: linux-binaries
            gui_name: Gui
            cli_name: cli
          - os: macos-latest
            artifact_name: macos-binaries
            gui_name: Gui
            cli_name: cli

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Executables
        run: |
          python build_exe.py --all

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/${{ matrix.gui_name }}
            dist/${{ matrix.cli_name }}
          if-no-files-found: error
